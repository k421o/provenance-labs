[project]
name = "provenance-labs"
version = "0.1.0.dev0"
description = "Validation environment for provenance-realistic review research"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "k421o" }]
dependencies = []

[dependency-groups]
dev = [
  "markdown-it-py>=4,<5",
  "pytest>=8.4,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
  "tests",
  "evals/scenarios/record-publication-a/fixture",
  "evals/scenarios/record-publication-b/fixture",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
